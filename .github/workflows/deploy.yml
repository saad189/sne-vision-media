name: Build and publish site

# Builds the Angular app on every push to master and commits the build output
# to the `deploy` branch. The host (Hostinger) deploys that branch on push.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: media-landing-v2/package-lock.json

      - name: Install dependencies
        working-directory: media-landing-v2
        run: npm ci

      - name: Build
        working-directory: media-landing-v2
        run: npm run build

      - name: Publish build output to the deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          build="media-landing-v2/dist/media-landing-v2/browser"
          test -f "$build/index.html"

          # Keep a linear history on `deploy` so the host can fast-forward.
          if git ls-remote --exit-code --heads "$remote" deploy >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch deploy "$remote" out
          else
            mkdir out && git -C out init --quiet --initial-branch deploy
            git -C out remote add origin "$remote"
          fi

          rsync -a --delete --exclude .git "$build"/ out/

          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Build output unchanged; nothing to publish."
            exit 0
          fi
          git commit --quiet -m "Build of ${GITHUB_SHA}"
          git push --quiet origin deploy
