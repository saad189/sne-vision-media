<section id="ecosystem" class="ecosystem-form-section section-pad">
  <div class="section-inner">
    <div class="section-header mb-0">
      <span class="section-eyebrow">Ecosystem</span>
      <h2 class="section-title">Join our Ecosystem</h2>
    </div>

    <div class="eco-form-wrapper">
      <div class="eco-logo" aria-hidden="true">
        <img src="/assets/images/sne_logo.png" alt="Vision Media" />
      </div>
      <form
        [formGroup]="ecosystemForm"
        (ngSubmit)="submitEcosystem()"
        novalidate
      >
        <div class="eco-grid">
          <div class="field">
            <label for="eco-name" class="sr-only">Name</label>
            <input
              id="eco-name"
              type="text"
              formControlName="name"
              placeholder="Name"
              maxlength="120"
              aria-describedby="eco-name-err"
              [class.invalid]="errorFor('name')"
              [attr.aria-invalid]="!!errorFor('name')"
            />
            @if (errorFor('name'); as err) {
              <p id="eco-name-err" class="field-error">{{ err }}</p>
            }
          </div>
          <div class="field">
            <label for="eco-email" class="sr-only">Email</label>
            <input
              id="eco-email"
              type="email"
              formControlName="email"
              placeholder="Email"
              maxlength="254"
              aria-describedby="eco-email-err"
              [class.invalid]="errorFor('email')"
              [attr.aria-invalid]="!!errorFor('email')"
            />
            @if (errorFor('email'); as err) {
              <p id="eco-email-err" class="field-error">{{ err }}</p>
            }
          </div>
          <div class="field">
            <label for="eco-phone" class="sr-only">Phone</label>
            <input
              id="eco-phone"
              type="text"
              formControlName="phone"
              placeholder="Phone"
              maxlength="40"
              aria-describedby="eco-phone-err"
              [class.invalid]="errorFor('phone')"
              [attr.aria-invalid]="!!errorFor('phone')"
            />
            @if (errorFor('phone'); as err) {
              <p id="eco-phone-err" class="field-error">{{ err }}</p>
            }
          </div>
          <div class="field">
            <label for="eco-designation" class="sr-only">Designation</label>
            <input
              id="eco-designation"
              type="text"
              formControlName="designation"
              placeholder="Designation"
              maxlength="120"
              aria-describedby="eco-designation-err"
              [class.invalid]="errorFor('designation')"
              [attr.aria-invalid]="!!errorFor('designation')"
            />
            @if (errorFor('designation'); as err) {
              <p id="eco-designation-err" class="field-error">{{ err }}</p>
            }
          </div>
          <div class="field textarea-field">
            <label for="eco-message" class="sr-only">Message</label>
            <textarea
              id="eco-message"
              rows="3"
              formControlName="message"
              placeholder="Would You Like to Solve a Problem Or Support a Solution, Send Us a Message"
              maxlength="5000"
              aria-describedby="eco-message-err"
              [class.invalid]="errorFor('message')"
              [attr.aria-invalid]="!!errorFor('message')"
            ></textarea>
            @if (errorFor('message'); as err) {
              <p id="eco-message-err" class="field-error">{{ err }}</p>
            }
          </div>
        </div>
        <div class="submit-row">
          <button
            type="submit"
            class="submit-btn"
            [disabled]="submitting"
            [attr.aria-busy]="submitting"
            [attr.aria-disabled]="ecosystemForm.invalid && formSubmitted"
          >
            {{ submitting ? 'Sending…' : 'Send Message' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
