<!-- Optional quote / social bar (hidden in current design) -->
@if (variant === 'simple') {
  <div class="relative bg-[#4D4D4D] text-white py-2">
    <div class="container mx-auto px-4 relative flex items-center gap-4">
      <a
        href="https://www.instagram.com/sne_vision_media"
        aria-label="Instagram"
        class="shrink-0 relative z-20"
        >
        <img
          src="/assets/images/instagram.png"
          alt="Instagram"
          class="w-5 h-5"
          />
      </a>
      <div class="flex-1 text-center text-xs sm:text-sm tracking-wide font-light">
        "What one man Nation can do, another can do"
      </div>
    </div>
  </div>
}

<!-- Main navigation bar aligned with design -->
<nav
  class="sticky top-0 z-40 bg-[#f2f2f2]/95 backdrop-blur supports-[backdrop-filter]:bg-[#f2f2f2]/80"
  >
  <div class="max-w-7xl mx-auto px-4 lg:px-8 h-20 flex items-center gap-4 lg:gap-8">
    <!-- Logo -->
    <a
      routerLink=""
      class="shrink-0 flex items-center h-full"
      aria-label="Vision Media Home"
      >
      <img
        src="/assets/images/sne_logo_title.png"
        alt="Vision Media"
        class="object-contain w-auto h-[4.5rem]"
        />
    </a>
    <!-- Nav links centered (md and up) -->
    <ul
      class="hidden md:flex flex-1 items-center justify-center gap-4 lg:gap-10 text-sm font-medium tracking-wide text-gray-800"
      >
      @for (l of links; track l.label) {
        <li>
          <a
            [routerLink]="l.path"
            [fragment]="l.fragment"
            [routerLinkActive]="l.fragment ? [] : 'active-link'"
            class="nav-link whitespace-nowrap"
            >{{ l.label }}</a
          >
        </li>
      }
    </ul>
    <div class="hidden md:flex items-center">
      <button
        routerLink="/"
        fragment="ecosystem"
        class="join-btn px-4 lg:px-6 py-2 rounded-full text-sm font-semibold bg-[#4D4D4D] text-white hover:bg-black transition-colors whitespace-nowrap"
        >
        Join our Ecosystem
      </button>
    </div>
    <!-- Hamburger (below md) -->
    <button
      #menuBtn
      type="button"
      class="md:hidden ml-auto inline-flex items-center justify-center w-11 h-11 rounded-md text-gray-800 hover:bg-black/5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black"
      aria-controls="mobile-menu"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'"
      (click)="menuOpen = !menuOpen"
      >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        class="w-6 h-6"
        aria-hidden="true"
        >
        @if (menuOpen) {
          <path d="M6 6l12 12M18 6L6 18" />
        } @else {
          <path d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
    </button>
  </div>
  @if (menuOpen) {
    <div id="mobile-menu" class="md:hidden border-t border-black/10 px-4 pb-4">
      <ul class="flex flex-col text-base font-medium text-gray-800">
        @for (l of links; track l.label) {
          <li>
            <a
              [routerLink]="l.path"
              [fragment]="l.fragment"
              class="nav-link block py-3"
              (click)="menuOpen = false"
              >{{ l.label }}</a
            >
          </li>
        }
      </ul>
      <button
        routerLink="/"
        fragment="ecosystem"
        class="join-btn mt-2 w-full px-6 py-3 rounded-full text-sm font-semibold bg-[#4D4D4D] text-white hover:bg-black transition-colors"
        (click)="menuOpen = false"
        >
        Join our Ecosystem
      </button>
    </div>
  }
</nav>
