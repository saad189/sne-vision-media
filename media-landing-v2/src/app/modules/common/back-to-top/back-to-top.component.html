<button
  type="button"
  class="back-to-top"
  (click)="scrollToTop()"
  [class.visible]="visible()"
  aria-label="Scroll back to top"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="icon"
  >
    <path d="M12 19V5" />
    <path d="m5 12 7-7 7 7" />
  </svg>
</button>
