<div class="login-shell">
  <div class="login-card" [class.loading]="loading || initializing">
    <h1 class="title">Admin Panel</h1>
    <p class="subtitle" *ngIf="!initializing">Sign in to continue</p>
    <div class="init-spinner" *ngIf="initializing">
      <div class="spinner"></div>
      <p class="init-text">Preparing authentication…</p>
    </div>
    <form
      *ngIf="!initializing"
      [formGroup]="form"
      (ngSubmit)="login()"
      class="admin-login-form"
      novalidate
    >
      <div
        class="field"
        [class.invalid]="
          form.get('email')?.invalid && form.get('email')?.touched
        "
      >
        <label for="email">Email</label>
        <input
          id="email"
          formControlName="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
        />
        <div
          class="err"
          *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
        >
          Valid email required
        </div>
      </div>
      <div
        class="field"
        [class.invalid]="
          form.get('password')?.invalid && form.get('password')?.touched
        "
      >
        <label for="password">Password</label>
        <input
          id="password"
          formControlName="password"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
        <div
          class="err"
          *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
        >
          Password required
        </div>
      </div>
      <button
        class="primary"
        type="submit"
        [disabled]="form.invalid || loading"
      >
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
      <div *ngIf="error" class="err global">{{ error }}</div>
    </form>
  </div>
</div>
