<section class="a-page a-narrow">
  <header class="a-page-head">
    <div>
      <a class="a-back" routerLink="/admin/events">← Events</a>
      <h1>New event</h1>
      <p>Schedule a seminar, workshop or meetup.</p>
    </div>
  </header>

  <form class="a-form" (ngSubmit)="create()" #f="ngForm" novalidate>
    <div class="a-card a-form-section">
      <h2>Details</h2>
      <div class="a-grid-2">
        <div class="a-field">
          <label for="ev-name">Name <span class="a-req">*</span></label>
          <input
            id="ev-name"
            name="name"
            [(ngModel)]="model.name"
            required
            maxlength="120"
            placeholder="Media Production Masterclass"
          />
        </div>
        <div class="a-field">
          <label for="ev-type">Event type <span class="a-req">*</span></label>
          <select
            id="ev-type"
            name="event_type_id"
            required
            [(ngModel)]="model.event_type_id"
            [disabled]="loadingTypes || !eventTypes.length"
          >
            <option value="" disabled>
              {{
                loadingTypes
                  ? "Loading…"
                  : eventTypes.length
                    ? "Select a type"
                    : "No event types exist yet"
              }}
            </option>
            @for (t of eventTypes; track t.id) {
              <option [value]="t.id">{{ t.name }}</option>
            }
          </select>
        </div>
      </div>
      <div class="a-field">
        <label for="ev-desc">Description</label>
        <textarea
          id="ev-desc"
          name="description"
          rows="4"
          [(ngModel)]="model.description"
        ></textarea>
      </div>
      <div class="a-field">
        <label for="ev-location">Location</label>
        <input
          id="ev-location"
          name="location"
          [(ngModel)]="model.location"
          placeholder="NUST Islamabad / Online"
        />
      </div>
    </div>

    <div class="a-card a-form-section">
      <h2>Schedule</h2>
      <div class="a-grid-2">
        <div class="a-field">
          <label for="ev-start">Starts at (UTC)</label>
          <input
            id="ev-start"
            type="datetime-local"
            name="starts_at"
            [(ngModel)]="model.starts_at"
          />
        </div>
        <div class="a-field">
          <label for="ev-end">Ends at (UTC)</label>
          <input
            id="ev-end"
            type="datetime-local"
            name="ends_at"
            [(ngModel)]="model.ends_at"
          />
        </div>
      </div>
    </div>

    <div class="a-card a-form-section">
      <h2>Image</h2>
      <app-file-upload
        label="Event image"
        hint="PNG, JPG or WebP, up to 5 MB"
        kind="image"
        accept="image/*"
        folder="events"
        [bucket]="imagesBucket"
        [maxBytes]="maxImageBytes"
        [path]="model.image_url || ''"
        (pathChange)="model.image_url = $event"
        (busyChange)="uploading = $event"
      />
    </div>

    @if (error) {
      <div class="a-alert" role="alert">{{ error }}</div>
    }
    <div class="a-form-actions">
      @if (uploading) {
        <span class="a-hint" role="status"
          >Waiting for the upload to finish…</span
        >
      }
      <a class="a-btn ghost" routerLink="/admin/events">Cancel</a>
      <button
        class="a-btn primary"
        type="submit"
        [disabled]="submitting || uploading || !f.form.valid"
      >
        {{ submitting ? "Saving…" : "Create event" }}
      </button>
    </div>
  </form>
</section>
