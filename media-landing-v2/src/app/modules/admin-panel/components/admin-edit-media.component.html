<section class="a-page a-narrow">
  <header class="a-page-head">
    <div>
      <a class="a-back" routerLink="/admin/media-works">← Media works</a>
      <h1>Edit media work</h1>
      @if (media) {
        <p>{{ media.name }}</p>
      }
    </div>
  </header>

  @if (error) {
    <div class="a-alert" role="alert">{{ error }}</div>
  }
  @if (loading) {
    <div class="a-card a-skel-list" aria-busy="true" aria-label="Loading">
      @for (i of [1, 2, 3]; track i) {
        <div class="a-skel"></div>
      }
    </div>
  } @else if (media) {
    <app-media-work-form
      submitLabel="Save changes"
      [value]="media"
      [submitting]="submitting"
      (save)="update($event)"
    />
  }
</section>
