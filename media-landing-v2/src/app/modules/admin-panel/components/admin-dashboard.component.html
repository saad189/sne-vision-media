<section class="a-page">
  <header class="a-page-head">
    <div>
      <h1>Dashboard</h1>
      <p>What is currently on the site.</p>
    </div>
  </header>

  <div class="a-stats">
    @for (s of stats; track s.label) {
      <a class="a-stat" [routerLink]="s.link">
        <span class="a-stat-num">{{ s.value ?? "–" }}</span>
        <span class="a-stat-label">{{ s.label }}</span>
        <span class="a-stat-sub">{{ s.sub }}</span>
      </a>
    }
  </div>

  <div class="a-card a-form-section">
    <h2>Quick actions</h2>
    <div class="a-quick-row">
      <a class="a-btn primary" routerLink="/admin/add-media">Add media work</a>
      <a class="a-btn ghost" routerLink="/admin/add-event">Add event</a>
      <a class="a-btn ghost" routerLink="/admin/add-category">Add category</a>
    </div>
  </div>
</section>
