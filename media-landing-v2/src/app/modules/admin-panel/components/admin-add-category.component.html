<section class="a-page a-narrow">
  <header class="a-page-head">
    <div>
      <a class="a-back" routerLink="/admin/categories">← Categories</a>
      <h1>New category</h1>
      <p>Categories group and filter media works.</p>
    </div>
  </header>

  <form class="a-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="a-card a-form-section">
      <div
        class="a-field"
        [class.invalid]="form.get('name')?.invalid && form.get('name')?.touched"
      >
        <label for="cat-name">Name <span class="a-req">*</span></label>
        <input
          id="cat-name"
          formControlName="name"
          maxlength="120"
          placeholder="e.g. Transportation"
        />
        @if (form.get('name')?.invalid && form.get('name')?.touched) {
          <p class="a-err">Name is required (up to 120 characters).</p>
        }
      </div>
      <div class="a-field">
        <label for="cat-desc">Description</label>
        <textarea
          id="cat-desc"
          rows="3"
          maxlength="500"
          formControlName="description"
          placeholder="Optional"
        ></textarea>
      </div>
    </div>

    @if (error) {
      <div class="a-alert" role="alert">{{ error }}</div>
    }
    <div class="a-form-actions">
      <a class="a-btn ghost" routerLink="/admin/categories">Cancel</a>
      <button class="a-btn primary" type="submit" [disabled]="submitting">
        {{ submitting ? "Saving…" : "Create category" }}
      </button>
    </div>
  </form>
</section>
