<div class="dashboard-shell">
  <div class="table-shell">
    <header class="head">
      <h1>Media Works</h1>
      <button class="secondary" (click)="load()" [disabled]="loading">
        Reload
      </button>
    </header>
    <div *ngIf="loading">Loading...</div>
    <div *ngIf="error" class="err">{{ error }}</div>
    <table *ngIf="!loading && !error && rows.length" class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Status</th>
          <th>Category</th>
          <th>Created</th>
          <th style="width: 140px">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of rows; let i = index; trackBy: trackById">
          <td>{{ r.name }}</td>
          <td>{{ r.type }}</td>
          <td>{{ r.status || "—" }}</td>
          <td>{{ r.categoryName || "—" }}</td>
          <td>{{ r.created_at | date : "short" }}</td>
          <td class="actions">
            <button class="secondary" (click)="edit(r)">Edit</button>
            <button class="danger" (click)="delete(r)">Del</button>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="!loading && !error && !rows.length" class="empty">
      No media works yet.
    </div>
  </div>
</div>
