<div class="add-shell">
  <div class="add-card">
    <header class="head">
      <h1>Create Media Work</h1>
      <p>Add a new project or use case entry below.</p>
    </header>
    <app-media-work-form
      class="media-form"
      [submitLabel]="'Create'"
      [submitting]="submitting"
      (save)="create($event)"
    ></app-media-work-form>
    <div *ngIf="error" class="err global">{{ error }}</div>
  </div>
</div>
